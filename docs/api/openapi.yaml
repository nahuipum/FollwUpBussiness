openapi: 3.1.0
info:
  title: FollowUpBussiness API
  version: 1.0.0
  summary: Contrato REST general del MVP
  description: |
    API multiempresa para administración, aplicación móvil y procesos de
    integración de FollowUpBussiness.

    Reglas globales:
    - El tenant y el usuario se derivan de la identidad autenticada.
    - Ningún `tenantId` recibido en payload se considera autoridad.
    - Las colecciones usan paginación por página y orden estable.
    - Fechas y horas se expresan en ISO 8601; la fecha operativa usa la zona
      horaria de la empresa.
    - Importes usan decimal; el servidor recalcula totales.
    - Comandos mobile sensibles requieren idempotencia.
    - Un `correlationId` se devuelve tanto en éxito como en error.
    - Auth WEB usa refresh solo en cookie HttpOnly; MOBILE usa body solo fuera
      de contexto navegador. El canal nunca concede identidad, tenant o rol.
  contact:
    name: FollowUpBussiness Engineering
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
  x-contract-status: READY_FOR_HANDOFF
  x-source-of-truth:
    - ../../00_CONTRATO_FUNCIONAL.md
    - ../stories/enablers/EN-013-definir-autenticacion-sesiones-y-recuperacion.md
    - ../architecture/adr/ADR-008-autenticacion-sesiones.md
    - ../stories/BACKLOG_REFINEMENT.md
    - ../stories/dependency-map.md
servers:
  - url: /api/v1
    description: Mismo host que el cliente
  - url: https://{host}/api/v1
    description: Ambiente desplegado
    variables:
      host:
        default: api.example.invalid
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Sesiones, recuperación de acceso e identidad actual.
  - name: Platform companies
    description: Administración global y onboarding de empresas.
  - name: Platform operations
    description: Operaciones internas y auditables de plataforma.
  - name: Company users
    description: Usuarios, roles y estados dentro de una empresa.
  - name: Settings
    description: Configuración operativa del tenant.
  - name: Territories
    description: Zonas comerciales y límites geográficos.
  - name: Sellers
    description: Vendedores, supervisión y asignaciones territoriales.
  - name: Customers
    description: Cartera, ubicación, asignación e historial de clientes.
  - name: Customer imports
    description: Plantilla e importación asíncrona de clientes.
  - name: Routes
    description: Planeación, publicación y ejecución de rutas.
  - name: Journeys
    description: Inicio, ubicación y cierre de la jornada del vendedor.
  - name: Tracking
    description: Presencia actual y recorridos históricos.
  - name: Visits
    description: Geocerca, check-in, check-out y correcciones.
  - name: Products
    description: Catálogo de productos disponible para venta.
  - name: Sales
    description: Registro, edición, anulación y consulta de ventas.
  - name: Reports
    description: Indicadores y exportaciones asíncronas.
  - name: Audit
    description: Consulta de acciones críticas trazables.
  - name: Devices
    description: Registro de dispositivos para notificaciones.
  - name: Mobile
    description: Lecturas agregadas para operación offline.
  - name: Mobile sync
    description: Sincronización idempotente de comandos offline.

paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Iniciar sesión
      description: |
        Respuesta neutral ante credenciales inválidas o cuenta no utilizable.
        WEB requiere un Origin permitido y recibe el refresh exclusivamente en
        cookie HttpOnly. MOBILE solo se admite sin contexto de navegador y
        recibe el refresh en el cuerpo. El header de canal no concede autoridad.
      security: []
      x-story-ids: [EN-013, BE-003, FE-001, MOB-001, INT-002, INT-003]
      parameters:
        - $ref: '#/components/parameters/AuthClient'
        - $ref: '#/components/parameters/ClientInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada por el canal solicitado y validado
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
            Set-Cookie: { $ref: '#/components/headers/WebRefreshSetCookie' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WebAuthenticationResponse'
                  - $ref: '#/components/schemas/MobileAuthenticationResponse'
                discriminator:
                  propertyName: channel
        '400': { $ref: '#/components/responses/AuthRequestInvalid' }
        '401': { $ref: '#/components/responses/LoginFailed' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
        '503': { $ref: '#/components/responses/AuthRateLimiterUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Renovar una sesión
      description: |
        Rota exactamente una vez el refresh de la familia. WEB usa únicamente
        la cookie HttpOnly y X-CSRF-Token; el body debe estar ausente. MOBILE
        exige el token opaco del body, ausencia de contexto navegador y no puede
        canjear una cookie web. Origin o Sec-Fetch con MOBILE se rechaza antes
        de leer credenciales.
      security:
        - webRefreshCookie: []
        - {}
      x-story-ids: [EN-013, BE-004, FE-003, MOB-002, INT-002, INT-003]
      parameters:
        - $ref: '#/components/parameters/AuthClient'
        - $ref: '#/components/parameters/ClientInstanceId'
        - $ref: '#/components/parameters/WebCsrfToken'
      requestBody:
        description: Obligatorio solo para MOBILE y prohibido para WEB.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRefreshSessionRequest'
      responses:
        '200':
          description: Sesión renovada y refresh token rotado
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
            Set-Cookie: { $ref: '#/components/headers/WebRefreshSetCookie' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WebAuthenticationResponse'
                  - $ref: '#/components/schemas/MobileAuthenticationResponse'
                discriminator:
                  propertyName: channel
        '400': { $ref: '#/components/responses/AuthRequestInvalid' }
        '401': { $ref: '#/components/responses/RefreshRejected' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '409': { $ref: '#/components/responses/RefreshAlreadyRotated' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
        '503': { $ref: '#/components/responses/AuthRateLimiterUnavailable' }

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revocar la sesión actual o todas las sesiones
      description: |
        Con allSessions=false revoca idempotentemente la familia de sid. Con
        true revoca todas las familias de la misma cuenta y tenant con access
        vigente. WEB sin access reintenta solo con cookie HttpOnly,
        X-Logout-Intent: PENDING y Origin allowlisted: no recibe credenciales y
        el servidor elimina la cookie. El preflight CORS permite
        X-Logout-Intent solo para ese Origin y POST /auth/logout. MOBILE pendiente usa exclusivamente
        X-Session-Revocation-Ticket para la familia, sin allSessions. Al
        resolverlo, el servidor revoca también las vinculaciones de dispositivo
        MOBILE de esa familia por el puerto interno de notificaciones, sin
        transportar ticket, access, refresh ni token push a dicho puerto.
        Limpieza local y detención de rastreo preceden a la respuesta remota.
        La revocación no se rechaza por rate limit.
      security:
        - bearerAuth: []
        - webRefreshCookie: []
        - sessionRevocationTicket: []
      x-required-roles: [PLATFORM_SUPERADMIN, COMPANY_ADMIN, SUPERVISOR, SELLER]
      x-story-ids: [EN-013, BE-005, FE-003, MOB-002, INT-002, INT-003]
      parameters:
        - $ref: '#/components/parameters/AuthClient'
        - $ref: '#/components/parameters/ClientInstanceId'
        - $ref: '#/components/parameters/WebCsrfToken'
        - $ref: '#/components/parameters/LogoutIntent'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Revocación completada o ya aplicada
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Set-Cookie: { $ref: '#/components/headers/WebRefreshClearCookie' }
        '400': { $ref: '#/components/responses/AuthRequestInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }

  /auth/password-recovery-requests:
    post:
      tags: [Authentication]
      operationId: requestPasswordRecovery
      summary: Solicitar activación o recuperación de contraseña
      description: |
        Siempre responde el mismo 202 para entrada válida, exista o no una
        cuenta utilizable. Acepta primero una solicitud genérica y resuelve la
        cuenta/token fuera del camino de respuesta; no devuelve token ni estado
        de cuenta. EN-017 define el proveedor de entrega.
      security: []
      x-story-ids: [EN-013, BE-006, BE-057, FE-002]
      parameters:
        - $ref: '#/components/parameters/AuthClient'
        - $ref: '#/components/parameters/ClientInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
      responses:
        '202':
          description: Solicitud aceptada, exista o no la cuenta
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400': { $ref: '#/components/responses/AuthRequestInvalid' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
        '503': { $ref: '#/components/responses/AuthRateLimiterUnavailable' }

  /auth/password-resets:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Activar una cuenta o restablecer contraseña con token de un uso
      description: |
        El propósito se deriva del token persistido, nunca del cliente. Un reset
        exitoso revoca todas las sesiones web/mobile de la cuenta. El token
        opaco no asigna tenant ni rol.
      security: []
      x-story-ids: [EN-013, BE-006, BE-057, FE-002]
      parameters:
        - $ref: '#/components/parameters/AuthClient'
        - $ref: '#/components/parameters/ClientInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Contraseña establecida, token consumido y sesiones revocadas
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/PasswordResetInvalid' }
        '410': { $ref: '#/components/responses/PasswordResetExpired' }
        '422': { $ref: '#/components/responses/PasswordPolicyViolation' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
        '503': { $ref: '#/components/responses/AuthRateLimiterUnavailable' }

  /me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Consultar identidad, empresa, roles y permisos actuales
      x-required-roles: [PLATFORM_SUPERADMIN, COMPANY_ADMIN, SUPERVISOR, SELLER]
      x-story-ids: [BE-003, BE-007, FE-003, MOB-001]
      responses:
        '200':
          description: Identidad autenticada
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/outbox/dlq/{eventId}/reprocess:
    post:
      tags: [Platform operations]
      operationId: reprocessOutboxDlqEvent
      summary: Reprocesar un evento de DLQ
      description: |
        Operación interna, explícita y auditada para reencolar un fallo de
        publicación. Solo PLATFORM_SUPERADMIN puede invocarla. El tenant,
        envelope, correlationId y operador se derivan de datos durables y de
        la autenticación; el cliente no envía cuerpo ni tenantId.
      x-internal: true
      x-required-roles: [PLATFORM_SUPERADMIN]
      x-story-ids: [BE-056]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Evento reencolado para un nuevo ciclo limitado de publicación
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /platform/companies:
    get:
      tags: [Platform companies]
      operationId: listCompanies
      summary: Listar empresas de la plataforma
      x-required-roles: [PLATFORM_SUPERADMIN]
      x-story-ids: [BE-001, BE-002]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CompanyStatus' }
      responses:
        '200':
          description: Empresas paginadas
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Platform companies]
      operationId: createCompany
      summary: Crear una empresa con configuración inicial
      x-required-roles: [PLATFORM_SUPERADMIN]
      x-story-ids: [BE-001, INT-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Empresa creada
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /platform/companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Platform companies]
      operationId: getCompany
      summary: Consultar una empresa
      x-required-roles: [PLATFORM_SUPERADMIN]
      x-story-ids: [BE-001, BE-002]
      responses:
        '200':
          description: Empresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /platform/companies/{companyId}/status:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    patch:
      tags: [Platform companies]
      operationId: changeCompanyStatus
      summary: Suspender o reactivar una empresa
      x-required-roles: [PLATFORM_SUPERADMIN]
      x-story-ids: [BE-002, INT-038]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCompanyStatusRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /platform/companies/{companyId}/initial-admin:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Platform companies]
      operationId: provisionInitialCompanyAdmin
      summary: Invitar al administrador inicial de una empresa
      x-required-roles: [PLATFORM_SUPERADMIN]
      x-story-ids: [BE-057, INT-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionInitialAdminRequest'
      responses:
        '202':
          description: Administrador provisionado e invitación aceptada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /company/users:
    get:
      tags: [Company users]
      operationId: listCompanyUsers
      summary: Listar usuarios de la empresa
      x-required-roles: [COMPANY_ADMIN, SUPERVISOR]
      x-story-ids: [BE-058, FE-004]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/CompanyManagementRole' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
      responses:
        '200':
          description: Usuarios paginados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Company users]
      operationId: inviteCompanyUser
      summary: Invitar un administrador o supervisor
      x-required-roles: [COMPANY_ADMIN]
      x-story-ids: [BE-058, FE-004, INT-033]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCompanyUserRequest'
      responses:
        '202':
          description: Usuario creado e invitación aceptada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /company/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Company users]
      operationId: getCompanyUser
      summary: Consultar un usuario de empresa
      x-required-roles: [COMPANY_ADMIN]
      x-story-ids: [BE-058, FE-004]
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Company users]
      operationId: updateCompanyUser
      summary: Editar datos y rol permitido de un usuario
      x-required-roles: [COMPANY_ADMIN]
      x-story-ids: [BE-058, FE-004]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyUserRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /company/users/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Company users]
      operationId: changeCompanyUserStatus
      summary: Bloquear o reactivar un usuario
      x-required-roles: [COMPANY_ADMIN]
      x-story-ids: [BE-005, BE-058, FE-004]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserStatusRequest'
      responses:
        '200':
          description: Estado actualizado y sesiones revocadas cuando aplica
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /company/settings:
    get:
      tags: [Settings]
      operationId: getCompanySettings
      summary: Consultar configuración operativa
      x-required-roles: [COMPANY_ADMIN, SUPERVISOR, SELLER]
      x-story-ids: [BE-054, FE-033, MOB-011, MOB-017]
      responses:
        '200':
          description: Configuración vigente y versión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanySettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Settings]
      operationId: updateCompanySettings
      summary: Configurar geocerca, tracking y capacidades condicionadas
      x-required-roles: [COMPANY_ADMIN]
      x-story-ids: [BE-054, FE-033]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanySettingsRequest'
      responses:
        '200':
          description: Configuración actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanySettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /territories:
    get:
      tags: [Territories]
      operationId: listTerritories
      summary: Listar zonas o territorios
      x-required-roles: [COMPANY_ADMIN, SUPERVISOR]
      x-story-ids: [BE-062, FE-037]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EntityStatus' }
      responses:
        '200':
          description: Territorios paginados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerritoryPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Territories]
      operationId: createTerritory
      summary: Crear una zona o territorio
      x-required-roles: [COMPANY_ADMIN]
      x-story-ids: [BE-062, FE-037]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTerritoryRequest' }
      responses:
        '201':
          description: Territorio creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Territory' }
