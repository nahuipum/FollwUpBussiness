  /journeys/{journeyId}/locations:
    parameters:
      - $ref: '#/components/parameters/JourneyId'
    post:
      tags: [Journeys, Mobile]
      operationId: appendJourneyLocations
      summary: Recibir un lote ordenado de ubicaciones
      description: Cada muestra tiene clientEventId propio. La guarda de lote precede a la guarda por muestra y vincula Idempotency-Key+batchId al tenant/owner derivados, jornada, deviceId y fingerprint del conjunto ordenado. Replay exacto devuelve el acuse original semánticamente idéntico, incluidos statuses originales, sin reprocesar muestras; no convierte ACCEPTED en DUPLICATE. Binding igual con contexto/fingerprint/orden distinto devuelve 409 LOCATION_BATCH_IDEMPOTENCY_CONFLICT sin mutación. Solo un lote lógico nuevo aplica guardas por muestra y puede devolver DUPLICATE por clientEventId previamente aceptado. ADR-016 exige jornada activa, máximo una aceptada por ventana UTC de capturedAt de 60 s, precisión <=50 m, antigüedad <=5 min y adelanto servidor <=2 min. Una inválida se rechaza individualmente sin efectos.
      x-required-roles: [SELLER]
      x-story-ids: [BE-029, BE-030, BE-031, MOB-008, MOB-009, INT-011]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationBatchRequest' }
      responses:
        '200':
          description: Acuse con exactamente un resultado por cada clientEventId recibido, en el mismo orden y sin resultados adicionales.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationBatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LocationBatchConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/LocationRateLimited' }

