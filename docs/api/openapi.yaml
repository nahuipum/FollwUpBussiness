components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 de acceso, 10 minutos, transportado solo en Authorization; nunca en cookie.
    webRefreshCookie:
      type: apiKey
      in: cookie
      name: __Host-fs-refresh
      description: Cookie refresh exclusiva de WEB; Secure, HttpOnly, SameSite=Strict y Path=/.
    sessionRevocationTicket:
      type: apiKey
      in: header
      name: X-Session-Revocation-Ticket
      description: Ticket opaco MOBILE de un uso y solo para revocar su propia familia; no autentica ni permite refresh.

  headers:
    CorrelationId:
      description: Identificador de trazabilidad de extremo a extremo.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    NoStore:
      description: Impide almacenar respuestas que contienen o alteran credenciales.
      schema: { type: string, const: no-store }
    NoCache:
      description: Compatibilidad HTTP/1.0 para respuestas de credenciales.
      schema: { type: string, const: no-cache }
    WebRefreshSetCookie:
      description: |
        Solo WEB. Contiene el refresh opaco; nunca es legible desde JavaScript ni
        se incluye en el JSON. Ausente para MOBILE.
      schema:
        type: string
        example: __Host-fs-refresh=<opaque>; Path=/; Secure; HttpOnly; SameSite=Strict
    WebRefreshClearCookie:
      description: Solo WEB. Elimina la cookie incluso si la familia ya estaba revocada.
      schema:
        type: string
        example: __Host-fs-refresh=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Strict

  parameters:
    AuthClient:
      name: X-Auth-Client
      in: header
      required: true
      description: |
        Selecciona transporte, no autoridad. WEB requiere Origin allowlisted.
        MOBILE requiere ausencia de Origin y Sec-Fetch; un navegador no puede
        declarar MOBILE para obtener un refresh en el body.
      schema:
        type: string
        enum: [WEB, MOBILE]
    ClientInstanceId:
      name: X-Client-Instance-Id
      in: header
      required: true
      description: UUID estable de instalación/perfil; no autentica ni concede tenant o rol.
      schema: { type: string, format: uuid }
    WebCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Obligatorio para WEB en refresh/logout; prohibido como sustituto de una credencial.
      schema:
        type: string
        minLength: 43
        maxLength: 128
    LogoutIntent:
      name: X-Logout-Intent
      in: header
      required: false
      description: Solo WEB pendiente sin access/CSRF; valor único PENDING, Origin allowlisted y cookie HttpOnly. Nunca habilita refresh ni allSessions.
      schema: { type: string, const: PENDING }
    Page:
      name: page
      in: query
      description: Página basada en cero.
      schema: { type: integer, minimum: 0, default: 0 }
    PageSize:
      name: pageSize
      in: query
      description: Cantidad máxima de elementos por página.
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Search:
      name: search
      in: query
      schema: { type: string, minLength: 1, maxLength: 120 }
    DateFrom:
      name: dateFrom
      in: query
      required: true
      schema: { type: string, format: date }
    DateTo:
      name: dateTo
      in: query
      required: true
      schema: { type: string, format: date }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión de la entidad entre comillas, por ejemplo "7".
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID estable por comando lógico; reutilizarlo en reintentos del mismo comando.
      schema: { type: string, format: uuid }
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TerritoryId:
      name: territoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SellerId:
      name: sellerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RouteId:
      name: routeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JourneyId:
      name: journeyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VisitId:
      name: visitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SaleId:
      name: saleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Solicitud mal formada
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthRequestInvalid:
      description: Canal/origen de autenticación incompatible o solicitud mal formada
      x-error-codes: [AUTH_CLIENT_CHANNEL_INVALID, VALIDATION_FAILED]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    LoginFailed:
      description: Credenciales o estado de cuenta/empresa no utilizables; respuesta neutral
      x-error-codes: [AUTHENTICATION_FAILED]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RefreshRejected:
      description: Refresh expirado, inválido/revocado o reutilizado
      x-error-codes: [REFRESH_TOKEN_EXPIRED, REFRESH_TOKEN_INVALID, REFRESH_TOKEN_REUSED]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CsrfRejected:
      description: Token CSRF web ausente o inválido; no consume el refresh
      x-error-codes: [CSRF_TOKEN_INVALID]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RefreshAlreadyRotated:
      description: El mismo refresh ya ganó una rotación concurrente controlada; no se reemite el sucesor
      x-error-codes: [REFRESH_ALREADY_ROTATED]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PasswordResetInvalid:
      description: Token malformado, desconocido, consumido o de propósito incompatible
      x-error-codes: [PASSWORD_RESET_TOKEN_INVALID, AUTH_CLIENT_CHANNEL_INVALID, VALIDATION_FAILED]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PasswordResetExpired:
      description: Token de activación/recuperación reconocido pero expirado
      x-error-codes: [PASSWORD_RESET_TOKEN_EXPIRED]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthRateLimited:
      description: Límite temporal de autenticación excedido sin revelar existencia de cuenta
      x-error-codes: [AUTH_RATE_LIMITED]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthRateLimiterUnavailable:
      description: Operación cerrada temporalmente porque no puede aplicarse el control de abuso
      x-error-codes: [AUTH_RATE_LIMIT_UNAVAILABLE]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Identidad ausente, inválida o sesión revocada
      x-error-codes: [ACCESS_TOKEN_EXPIRED, ACCESS_TOKEN_INVALID, SESSION_REVOKED]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: La identidad no puede realizar la operación o acceder al recurso
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso inexistente dentro del alcance visible
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicto de estado, versión o idempotencia
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PasswordPolicyViolation:
      description: La nueva contraseña no cumple la política vigente
      x-error-codes: [PASSWORD_POLICY_VIOLATION]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    LocationBatchConflict:
      description: Idempotency-Key o batchId reutilizado con contexto, deviceId, conjunto u orden diferente; no se procesa ninguna muestra.
      x-error-codes: [LOCATION_BATCH_IDEMPOTENCY_CONFLICT]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    LocationRateLimited:
      description: Presupuesto de ubicación por tenant, usuario y jornada excedido, agregado entre dispositivos.
      x-error-codes: [LOCATION_RATE_LIMITED]
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RouteOptimizationUnavailable:
      description: Motor o proveedor de matriz temporalmente no disponible
      x-error-codes:
        - PROVIDER_UNCONFIGURED
        - PROVIDER_UNAUTHORIZED
        - PROVIDER_RATE_LIMITED
        - PROVIDER_TIMEOUT
        - SOLVER_TIME_LIMIT
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Gone:
      description: Recurso expirado por política de retención
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: Cuerpo o archivo excede el límite permitido
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Tipo de contenido no admitido
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnprocessableEntity:
      description: Solicitud sintácticamente válida que incumple reglas de negocio
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Error interno sin detalles sensibles
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,79}$' }
        detail: { type: string, maxLength: 1000 }
        instance: { type: string, format: uri-reference }
        correlationId: { type: string, maxLength: 100 }
        fieldErrors:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field: { type: string, maxLength: 200 }
        code: { type: string, maxLength: 80 }
        message: { type: string, maxLength: 300 }
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        pageSize: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    EntityStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    CompanyStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]
    UserStatus:
      type: string
      enum: [INVITED, ACTIVE, INACTIVE, LOCKED]
    PlatformRole:
      type: string
      enum: [PLATFORM_SUPERADMIN]
    CompanyRole:
      type: string
      enum: [COMPANY_ADMIN, SUPERVISOR, SELLER]
    CompanyManagementRole:
      type: string
      enum: [COMPANY_ADMIN, SUPERVISOR]
    UserRole:
      oneOf:
        - $ref: '#/components/schemas/PlatformRole'
        - $ref: '#/components/schemas/CompanyRole'
    GeoPoint:
      type: object
      additionalProperties: false
      description: Punto WGS 84 (SRID EPSG:4326) expresado en grados decimales.
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
          description: Correo electrónico o nombre de usuario.
        password: { type: string, minLength: 8, maxLength: 200, writeOnly: true }
        deviceName: { type: string, maxLength: 120 }
    MobileRefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      description: Solo MOBILE. WEB debe omitir por completo el body.
      properties:
        refreshToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: Refresh opaco almacenado en secure storage; nunca acepta una cookie web.
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        allSessions:
          type: boolean
          default: false
          description: False revoca sid; true revoca todas las familias de la cuenta/tenant autenticados.
    PasswordRecoveryRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: Token opaco de activación (24 h) o recuperación (30 min), de un solo uso.
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Debe cumplir la política vigente y ocupar como máximo 72 bytes UTF-8 para BCrypt.
    AccessCredentials:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: JWT RS256 para mantener solo en memoria.
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, const: 600, description: Segundos hasta expirar el access token. }
    WebAuthenticationResponse:
      type: object
      additionalProperties: false
      required: [channel, credentials, csrfToken, user]
      properties:
        channel: { type: string, const: WEB }
        credentials: { $ref: '#/components/schemas/AccessCredentials' }
        csrfToken:
          type: string
          minLength: 43
          maxLength: 128
          description: Rotado con la familia; enviar en X-CSRF-Token. No es el refresh.
        user: { $ref: '#/components/schemas/CurrentUser' }
    MobileAuthenticationResponse:
      type: object
      additionalProperties: false
      required: [channel, credentials, refreshToken, sessionRevocationTicket, refreshExpiresIn, user]
      properties:
        channel: { type: string, const: MOBILE }
        credentials: { $ref: '#/components/schemas/AccessCredentials' }
        refreshToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Secreto opaco para secure storage móvil; nunca se entrega a WEB.
        sessionRevocationTicket:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Ticket opaco de un uso, solo para cerrar remotamente la propia familia tras logout local; no sirve para autenticar ni renovar.
        refreshExpiresIn:
          type: integer
          minimum: 1
          maximum: 2592000
          description: Segundos restantes hasta el límite absoluto de 30 días de la familia.
        user: { $ref: '#/components/schemas/CurrentUser' }
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, displayName, email, status, roles]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, maxLength: 160 }
        username: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/UserStatus' }
        roles:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/UserRole' }
    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [company]
          properties:
            company:
              oneOf:
                - $ref: '#/components/schemas/Company'
                - type: 'null'

    CompanySettings:
      type: object
      additionalProperties: false
      required: [timezone, currency, geofenceRadiusMeters, trackingIntervalSeconds]
      properties:
        timezone: { type: string, maxLength: 100, example: America/Lima }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: PEN }
        geofenceRadiusMeters: { type: integer, const: 100, description: 'ADR-016: valor fijo del MVP; cambios requieren ADR sustituto.' }
        trackingIntervalSeconds: { type: integer, const: 60, description: 'ADR-016: valor fijo del MVP; cambios requieren ADR sustituto.' }
        locationRetentionDays: { type: integer, const: 90, description: 'ADR-016: purga física al vencer; cambios requieren ADR sustituto.' }
        saleEditWindowMinutes: { type: integer, minimum: 0, maximum: 10080 }
    UpdateCompanySettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        timezone: { type: string, maxLength: 100 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        geofenceRadiusMeters: { type: integer, const: 100, description: 'ADR-016: no modificable durante MVP.' }
        trackingIntervalSeconds: { type: integer, const: 60, description: 'ADR-016: no modificable durante MVP.' }
        locationRetentionDays: { type: integer, const: 90, description: 'ADR-016: no modificable durante MVP.' }
        saleEditWindowMinutes: { type: integer, minimum: 0, maximum: 10080 }
    Company:
      type: object
      additionalProperties: false
      required: [id, legalName, code, status, settings, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        legalName: { type: string, maxLength: 200 }
        tradeName: { type: string, maxLength: 200 }
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{2,39}$' }
        taxId: { type: string, maxLength: 30 }
        status: { $ref: '#/components/schemas/CompanyStatus' }
        settings: { $ref: '#/components/schemas/CompanySettings' }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        version: { type: integer, minimum: 1, readOnly: true }
    CompanyPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Company' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateCompanyRequest:
      type: object
      additionalProperties: false
      required: [legalName, code, settings]
      properties:
        legalName: { type: string, minLength: 2, maxLength: 200 }
        tradeName: { type: string, maxLength: 200 }
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{2,39}$' }
        taxId: { type: string, maxLength: 30 }
        settings: { $ref: '#/components/schemas/CompanySettings' }
    ChangeCompanyStatusRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { $ref: '#/components/schemas/CompanyStatus' }
        reason: { type: string, minLength: 5, maxLength: 500 }
    ProvisionInitialAdminRequest:
      type: object
      additionalProperties: false
      required: [displayName, email]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 160 }
        username: { type: string, minLength: 3, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
    User:
      type: object
      additionalProperties: false
      required: [id, displayName, email, status, role, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        displayName: { type: string, maxLength: 160 }
        username: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 30 }
        status: { $ref: '#/components/schemas/UserStatus' }
        role: { $ref: '#/components/schemas/CompanyManagementRole' }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        version: { type: integer, minimum: 1, readOnly: true }
    UserPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { $ref: '#/components/schemas/PageInfo' }
    InviteCompanyUserRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, role]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 160 }
        username: { type: string, minLength: 3, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: '#/components/schemas/CompanyManagementRole' }
    UpdateCompanyUserRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, role]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 160 }
        username: { type: string, minLength: 3, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: '#/components/schemas/CompanyManagementRole' }
    ChangeUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/UserStatus' }

    Territory:
      type: object
      additionalProperties: false
      required: [id, name, status, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 160 }
        code: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 500 }
        status: { $ref: '#/components/schemas/EntityStatus' }
        boundary:
          description: Polígono GeoJSON opcional, coordenadas en longitud/latitud.
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        version: { type: integer, minimum: 1, readOnly: true }
    TerritoryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Territory' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateTerritoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        code: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 500 }
        boundary: { type: object, additionalProperties: true }
    UpdateTerritoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        code: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 500 }
        status: { $ref: '#/components/schemas/EntityStatus' }
        boundary: { type: object, additionalProperties: true }

    Seller:
      type: object
      additionalProperties: false
      required: [id, userId, displayName, status, territoryIds, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        userId: { type: string, format: uuid }
        displayName: { type: string, maxLength: 160 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }
        employeeCode: { type: string, maxLength: 50 }
        status: { $ref: '#/components/schemas/EntityStatus' }
        supervisorId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        territoryIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        version: { type: integer, minimum: 1, readOnly: true }
    SellerPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Seller' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateSellerRequest:
      type: object
      additionalProperties: false
      required: [displayName, email]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 160 }
        username: { type: string, minLength: 3, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 30 }
        employeeCode: { type: string, maxLength: 50 }
        supervisorId: { type: string, format: uuid }
        territoryIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    UpdateSellerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: string, maxLength: 30 }
        employeeCode: { type: string, maxLength: 50 }
    ChangeEntityStatusRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { $ref: '#/components/schemas/EntityStatus' }
        reason: { type: string, minLength: 5, maxLength: 500 }
    AssignSupervisorRequest:
      type: object
      additionalProperties: false
      required: [supervisorId]
      properties:
        supervisorId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
    AssignTerritoriesRequest:
      type: object
      additionalProperties: false
      required: [territoryIds]
      properties:
        territoryIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }

    Customer:
      type: object
      additionalProperties: false
      required: [id, name, status, location, assignedSellerIds, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 200 }
        documentType: { type: string, maxLength: 30 }
        documentNumber: { type: string, maxLength: 40 }
        phone: { type: string, maxLength: 30 }
        email: { type: string, format: email, maxLength: 254 }
        address: { type: string, maxLength: 300 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        visitFrequencyDays: { type: integer, minimum: 1, maximum: 365 }
        territoryId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        assignedSellerIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/EntityStatus' }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        version: { type: integer, minimum: 1, readOnly: true }
    CustomerPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required: [name, address, location]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        documentType: { type: string, maxLength: 30 }
        documentNumber: { type: string, maxLength: 40 }
        phone: { type: string, maxLength: 30 }
        email: { type: string, format: email, maxLength: 254 }
        address: { type: string, minLength: 3, maxLength: 300 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        visitFrequencyDays: { type: integer, minimum: 1, maximum: 365 }
        territoryId: { type: string, format: uuid }
    UpdateCustomerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        documentType: { type: string, maxLength: 30 }
        documentNumber: { type: string, maxLength: 40 }
        phone: { type: string, maxLength: 30 }
        email: { type: string, format: email, maxLength: 254 }
        address: { type: string, minLength: 3, maxLength: 300 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        visitFrequencyDays: { type: integer, minimum: 1, maximum: 365 }
        territoryId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/EntityStatus' }
    CustomerDuplicateCheckRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        documentNumber: { type: string, maxLength: 40 }
        phone: { type: string, maxLength: 30 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        excludeCustomerId: { type: string, format: uuid }
    DuplicateCandidate:
      type: object
      additionalProperties: false
      required: [customer, score, matchedFields]
      properties:
        customer: { $ref: '#/components/schemas/Customer' }
        score: { type: number, format: double, minimum: 0, maximum: 1 }
        matchedFields:
          type: array
          uniqueItems: true
          items: { type: string, enum: [DOCUMENT, PHONE, NAME, LOCATION] }
    CustomerDuplicateCheckResponse:
      type: object
      additionalProperties: false
      required: [hasPossibleDuplicates, candidates]
      properties:
        hasPossibleDuplicates: { type: boolean }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/DuplicateCandidate' }
    AssignCustomerRequest:
      type: object
      additionalProperties: false
      required: [sellerIds, effectiveFrom]
      properties:
        sellerIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        reason: { type: string, maxLength: 500 }
    CustomerAssignment:
      type: object
      additionalProperties: false
      required: [customerId, sellerIds, effectiveFrom, updatedAt, version]
      properties:
        customerId: { type: string, format: uuid }
        sellerIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    BatchAssignCustomersRequest:
      type: object
      additionalProperties: false
      required: [customerIds, sellerIds, effectiveFrom]
      properties:
        customerIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: string, format: uuid }
        sellerIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        reason: { type: string, maxLength: 500 }
    BatchAssignmentResult:
      type: object
      additionalProperties: false
      required: [customerId, status]
      properties:
        customerId: { type: string, format: uuid }
        status: { type: string, enum: [ASSIGNED, REJECTED] }
        errorCode: { type: string, maxLength: 80 }
    BatchAssignCustomersResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/BatchAssignmentResult' }
    VisitHistoryItem:
      type: object
      additionalProperties: false
      required: [visitId, startedAt, status]
      properties:
        visitId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        status: { $ref: '#/components/schemas/VisitStatus' }
        result: { $ref: '#/components/schemas/VisitResultCode' }
    SaleHistoryItem:
      type: object
      additionalProperties: false
      required: [saleId, occurredAt, total, currency, status]
      properties:
        saleId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        total: { type: number, multipleOf: 0.01, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { $ref: '#/components/schemas/SaleStatus' }
    CustomerHistory:
      type: object
      additionalProperties: false
      required: [customer, visits, sales]
      properties:
        customer: { $ref: '#/components/schemas/Customer' }
        visits:
          type: array
          items: { $ref: '#/components/schemas/VisitHistoryItem' }
        sales:
          type: array
          items: { $ref: '#/components/schemas/SaleHistoryItem' }
    ImportJobStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED]
    CustomerImportJob:
      type: object
      additionalProperties: false
      required: [id, status, totalRows, acceptedRows, rejectedRows, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ImportJobStatus' }
        totalRows: { type: integer, minimum: 0 }
        acceptedRows: { type: integer, minimum: 0 }
        rejectedRows: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        completedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        errorFileExpiresAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'

    RouteStatus:
      type: string
      enum: [DRAFT, PUBLISHED, IN_PROGRESS, COMPLETED, CANCELLED]
    RoutePointStatus:
      type: string
      enum: [PENDING, VISITED, SKIPPED]
    RoutePoint:
      type: object
      additionalProperties: false
      required: [id, customerId, sequence, status, location]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: string, maxLength: 200 }
        sequence: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/RoutePointStatus' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        plannedArrivalAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    Route:
      type: object
      additionalProperties: false
      required: [id, date, sellerId, status, points, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 160 }
        date: { type: string, format: date }
        sellerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RouteStatus' }
        startLocation: { $ref: '#/components/schemas/GeoPoint' }
        points:
          type: array
          items: { $ref: '#/components/schemas/RoutePoint' }
        publishedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        version: { type: integer, minimum: 1, readOnly: true }
    RoutePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Route' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateRouteRequest:
      type: object
      additionalProperties: false
      required: [date, sellerId, customerIds]
      properties:
        name: { type: string, maxLength: 160 }
        date: { type: string, format: date }
        sellerId: { type: string, format: uuid }
        startLocation: { $ref: '#/components/schemas/GeoPoint' }
        customerIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
    UpdateRouteRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, maxLength: 160 }
        date: { type: string, format: date }
        sellerId: { type: string, format: uuid }
        startLocation: { $ref: '#/components/schemas/GeoPoint' }
    OptimizeRouteRequest:
      type: object
      additionalProperties: false
      required:
        - routeId
        - date
        - sellerId
        - territoryId
        - startLocation
        - endLocation
        - availability
        - baseRouteVersion
        - visits
      properties:
        routeId: { type: string, format: uuid }
        date: { type: string, format: date }
        sellerId: { type: string, format: uuid }
        territoryId:
          type: string
          format: uuid
          description: Zona autorizada; debe pertenecer al tenant autenticado.
        startLocation: { $ref: '#/components/schemas/GeoPoint' }
        endLocation: { $ref: '#/components/schemas/GeoPoint' }
        availability: { $ref: '#/components/schemas/TimeWindow' }
        baseRouteVersion:
          type: integer
          minimum: 1
          description: Versión base usada para detectar edición concurrente.
        visits:
          type: array
          minItems: 1
          maxItems: 9
          uniqueItems: true
          description: Los customerId deben ser únicos y pertenecer al mismo tenant y territorio.
          items: { $ref: '#/components/schemas/OptimizeRouteVisitRequest' }
    TimeWindow:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: Debe ser posterior a start; el backend valida la zona operativa.
    OptimizeRouteVisitRequest:
      type: object
      additionalProperties: false
      required: [customerId, serviceDurationSeconds, priority]
      properties:
        customerId: { type: string, format: uuid }
        serviceDurationSeconds:
          type: integer
          minimum: 1
        priority:
          type: integer
          minimum: 1
          description: Una prioridad mayor aplica mayor penalización por no atender.
        windows:
          type: array
          minItems: 1
          uniqueItems: true
          description: Ventanas duras; no se relajan silenciosamente.
          items: { $ref: '#/components/schemas/TimeWindow' }
    OptimizeRouteResponse:
      type: object
      additionalProperties: false
      required:
        - routeId
        - proposalVersion
        - baseRouteVersion
        - published
        - orderedVisits
        - unassignedVisits
        - totalTravelSeconds
        - totalServiceSeconds
        - totalDistanceMeters
        - optimality
        - generatedAt
      properties:
        routeId: { type: string, format: uuid }
        proposalVersion: { type: integer, minimum: 1, readOnly: true }
        baseRouteVersion: { type: integer, minimum: 1 }
        published:
          type: boolean
          const: false
          readOnly: true
          description: Optimizar nunca publica una ruta.
        orderedVisits:
          type: array
          items: { $ref: '#/components/schemas/OptimizedRouteVisit' }
        unassignedVisits:
          type: array
          items: { $ref: '#/components/schemas/UnassignedRouteVisit' }
        totalTravelSeconds: { type: integer, minimum: 0 }
        totalServiceSeconds: { type: integer, minimum: 0 }
        totalDistanceMeters: { type: integer, minimum: 0 }
        optimality:
          type: string
          enum: [FEASIBLE, OPTIMAL, TIME_LIMIT]
        generatedAt: { type: string, format: date-time, readOnly: true }
    OptimizedRouteVisit:
      type: object
      additionalProperties: false
      required: [customerId, sequence, plannedArrivalAt, plannedDepartureAt]
      properties:
        customerId: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        plannedArrivalAt: { type: string, format: date-time }
        plannedDepartureAt: { type: string, format: date-time }
    UnassignedRouteVisit:
      type: object
      additionalProperties: false
      required: [customerId, reason]
      properties:
        customerId: { type: string, format: uuid }
        reason:
          type: string
          enum: [OUTSIDE_SHIFT, TIME_WINDOW_CONFLICT, UNREACHABLE, LIMIT_EXCEEDED]
    ReorderRoutePointsRequest:
      type: object
      additionalProperties: false
      required: [routePointIds]
      properties:
        routePointIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    PublishRouteRequest:
      type: object
      additionalProperties: false
      properties:
        notifySeller: { type: boolean, default: true }
    ReassignRouteRequest:
      type: object
      additionalProperties: false
      required: [sellerId, reason]
      properties:
        sellerId: { type: string, format: uuid }
        reason: { type: string, minLength: 5, maxLength: 500 }
    CopyRouteRequest:
      type: object
      additionalProperties: false
      required: [date, sellerId]
      properties:
        date: { type: string, format: date }
        sellerId: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
    SuggestedCustomer:
      type: object
      additionalProperties: false
      required: [customer, priority, reason]
      properties:
        customer: { $ref: '#/components/schemas/Customer' }
        priority: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 300 }
        lastVisitAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    SuggestedCustomerPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SuggestedCustomer' }
        page: { $ref: '#/components/schemas/PageInfo' }
    RouteExecution:
      type: object
      additionalProperties: false
      required: [route, plannedPoints, executedTrack, visits]
      properties:
        route: { $ref: '#/components/schemas/Route' }
        plannedPoints:
          type: array
          items: { $ref: '#/components/schemas/RoutePoint' }
        executedTrack:
          type: array
          items: { $ref: '#/components/schemas/TrackPoint' }
        visits:
          type: array
          items: { $ref: '#/components/schemas/VisitHistoryItem' }

    JourneyStatus:
      type: string
      enum: [ACTIVE, CLOSED]
    StartJourneyRequest:
      type: object
      additionalProperties: false
      required: [clientEventId, startedAt, initialLocation]
      properties:
        clientEventId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        initialLocation: { $ref: '#/components/schemas/GeoPoint' }
        locationPermission: { type: string, enum: [ALWAYS, WHILE_IN_USE] }
    Journey:
      type: object
      additionalProperties: false
      required: [id, sellerId, businessDate, startedAt, status, pendingCommandCount, version]
      properties:
        id: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        startedAt: { type: string, format: date-time }
        endedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        status: { $ref: '#/components/schemas/JourneyStatus' }
        pendingCommandCount: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
    LocationSample:
      type: object
      additionalProperties: false
      required: [clientEventId, capturedAt, location, accuracyMeters]
      properties:
        clientEventId: { type: string, format: uuid }
        capturedAt: { type: string, format: date-time, description: 'Regla servidor: máximo 5 min de antigüedad y máximo 2 min en el futuro.' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        accuracyMeters: { type: number, minimum: 0, maximum: 10000, description: 'Rango estructural seguro del transporte. El servidor evalúa la regla de negocio: >50 m produce REJECTED/LOCATION_ACCURACY_EXCEEDED para esta muestra, sin invalidar las demás del lote ni persistirla como ubicación.' }
        altitudeMeters: { type: number }
        speedMetersPerSecond: { type: number, minimum: 0 }
        headingDegrees: { type: number, minimum: 0, maximum: 360 }
        batteryPercent: { type: integer, minimum: 0, maximum: 100 }
        mocked: { type: boolean, description: 'true implica LOCATION_MOCKED; ausente implica integridad UNKNOWN y no habilita visita.' }
    LocationBatchRequest:
      type: object
      additionalProperties: false
      required: [batchId, deviceId, samples]
      properties:
        batchId: { type: string, format: uuid, description: 'Idempotencia estable del lote lógico; no sustituye clientEventId por muestra.' }
        deviceId: { type: string, format: uuid }
        samples:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/LocationSample' }
    LocationResult:
      description: Unión discriminada por status; ninguna variante contiene coordenadas.
      oneOf:
        - $ref: '#/components/schemas/AcceptedLocationResult'
        - $ref: '#/components/schemas/DuplicateLocationResult'
        - $ref: '#/components/schemas/RejectedLocationResult'
      discriminator:
        propertyName: status
        mapping:
          ACCEPTED: '#/components/schemas/AcceptedLocationResult'
          DUPLICATE: '#/components/schemas/DuplicateLocationResult'
          REJECTED: '#/components/schemas/RejectedLocationResult'
    AcceptedLocationResult:
      type: object
      additionalProperties: false
      required: [clientEventId, status, serverId, integrityStatus]
      properties:
        clientEventId: { type: string, format: uuid }
        status: { type: string, const: ACCEPTED }
        serverId: { type: string, format: uuid }
        integrityStatus: { $ref: '#/components/schemas/LocationIntegrityStatus' }
    DuplicateLocationResult:
      type: object
      additionalProperties: false
      required: [clientEventId, status, serverId, integrityStatus]
      properties:
        clientEventId: { type: string, format: uuid }
        status: { type: string, const: DUPLICATE }
        serverId: { type: string, format: uuid, description: 'Referencia de la ubicación previamente aceptada con igual fingerprint.' }
        integrityStatus: { $ref: '#/components/schemas/LocationIntegrityStatus' }
    RejectedLocationResult:
      type: object
      additionalProperties: false
      required: [clientEventId, status, errorCode]
      properties:
        clientEventId: { type: string, format: uuid }
        status: { type: string, const: REJECTED }
        errorCode:
          type: string
          enum: [LOCATION_ACCURACY_EXCEEDED, LOCATION_TOO_OLD, LOCATION_TIMESTAMP_IN_FUTURE, LOCATION_FREQUENCY_EXCEEDED, LOCATION_MOCKED, TRACKING_INACTIVE, LOCATION_UNAVAILABLE, IDEMPOTENCY_CONFLICT]
          description: Código estable y sanitizado; nunca contiene coordenadas. Repetir una muestra inválida conserva REJECTED.
    LocationBatchResponse:
      type: object
      additionalProperties: false
      description: results conserva el orden del request y contiene exactamente un elemento por cada samples[].clientEventId, sin omisiones, duplicados ni extras.
      required: [batchId, results, serverTime]
      properties:
        batchId: { type: string, format: uuid }
        results:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/LocationResult' }
        serverTime: { type: string, format: date-time }
    TrackPoint:
      type: object
      additionalProperties: false
      description: Solo representa una muestra aceptada, con accuracyMeters <=50 y aún dentro de la retención de 90 días. Nunca contiene rechazos ni telemetría degradada.
      required: [capturedAt, receivedAt, location, accuracyMeters, integrityStatus]
      properties:
        capturedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time, description: 'Instante de recepción servidor usado para mostrar última actualización.' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        accuracyMeters: { type: number, minimum: 0, maximum: 50 }
        integrityStatus: { $ref: '#/components/schemas/LocationIntegrityStatus' }
    LocationIntegrityStatus:
      type: string
      description: Señal declarada; no constituye prueba antifraude ni causa sanción automática.
      enum: [DECLARED_NOT_MOCKED, UNKNOWN]
    JourneyTrack:
      type: object
      additionalProperties: false
      required: [journeyId, sellerId, businessDate, points, page]
      properties:
        journeyId: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        points:
          type: array
          maxItems: 200
          description: Página ordenada por capturedAt y desempate estable del servidor.
          items: { $ref: '#/components/schemas/TrackPoint' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CloseJourneyRequest:
      type: object
      additionalProperties: false
      required: [clientEventId, endedAt, finalLocation, pendingCommandCount]
      properties:
        clientEventId: { type: string, format: uuid }
        endedAt: { type: string, format: date-time }
        finalLocation: { $ref: '#/components/schemas/GeoPoint' }
        pendingCommandCount: { type: integer, minimum: 0 }
        force:
          type: boolean
          default: false
          description: Solo se acepta si la política permite cerrar con pendientes.
    SellerPresenceStatus:
      type: string
      enum: [ONLINE, STALE, OFFLINE]
    ActiveSeller:
      type: object
      additionalProperties: false
      required: [seller, presenceStatus, activeJourneyId]
      properties:
        seller: { $ref: '#/components/schemas/Seller' }
        presenceStatus: { $ref: '#/components/schemas/SellerPresenceStatus' }
        activeJourneyId: { type: string, format: uuid }
        lastLocation:
          oneOf:
            - $ref: '#/components/schemas/TrackPoint'
            - type: 'null'
    ActiveSellerPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActiveSeller' }
        page: { $ref: '#/components/schemas/PageInfo' }

    VisitStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, CORRECTED]
    VisitResultCode:
      type: string
      enum: [SALE, NO_SALE, CLOSED, ABSENT, RESCHEDULED, OTHER]
    VisitResultOption:
      type: object
      additionalProperties: false
      required: [code, label, requiresReason]
      properties:
        code: { $ref: '#/components/schemas/VisitResultCode' }
        label: { type: string, maxLength: 100 }
        requiresReason: { type: boolean }
    ProximityValidationRequest:
      type: object
      additionalProperties: false
      required: [customerId, capturedAt, location, accuracyMeters]
      properties:
        customerId: { type: string, format: uuid }
        capturedAt: { type: string, format: date-time }
        location: { $ref: '#/components/schemas/GeoPoint' }
        accuracyMeters: { type: number, minimum: 0, maximum: 10000, description: 'Rango estructural. >50 m es baja precisión de negocio y produce eligible=false/reasonCode=LOW_ACCURACY, sin geocerca.' }
        mocked: { type: boolean, description: 'true rechaza geocerca; ausente produce integridad UNKNOWN y no habilita visita.' }
    ProximityValidationResponse:
      type: object
      additionalProperties: false
      required: [eligible, distanceMeters, allowedRadiusMeters, requiresException]
      properties:
        eligible: { type: boolean }
        distanceMeters: { type: number, minimum: 0 }
        allowedRadiusMeters: { type: integer, minimum: 1 }
        requiresException: { type: boolean }
        reasonCode: { type: string, enum: [WITHIN_RADIUS, OUTSIDE_RADIUS, LOW_ACCURACY, LOCATION_MOCKED, LOCATION_INTEGRITY_UNKNOWN] }
    Visit:
      type: object
      additionalProperties: false
      required: [id, customerId, sellerId, startedAt, checkInLocation, status, outOfRoute, version]
      properties:
        id: { type: string, format: uuid }
        journeyId: { type: string, format: uuid }
        routeId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        routePointId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        customerId: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        checkInLocation: { $ref: '#/components/schemas/GeoPoint' }
        checkOutLocation:
          oneOf:
            - $ref: '#/components/schemas/GeoPoint'
            - type: 'null'
        status: { $ref: '#/components/schemas/VisitStatus' }
        result:
          oneOf:
            - $ref: '#/components/schemas/VisitResultCode'
            - type: 'null'
        resultReason: { type: string, maxLength: 500 }
        outOfRoute: { type: boolean }
        geofenceExceptionId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        version: { type: integer, minimum: 1 }
    VisitPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Visit' }
        page: { $ref: '#/components/schemas/PageInfo' }
    VisitCheckInRequest:
      type: object
      additionalProperties: false
      required: [clientEventId, customerId, journeyId, startedAt, location, accuracyMeters]
      properties:
        clientEventId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        journeyId: { type: string, format: uuid }
        routePointId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        location: { $ref: '#/components/schemas/GeoPoint' }
        accuracyMeters: { type: number, minimum: 0, maximum: 10000, description: 'Rango estructural. >50 m se rechaza como regla de negocio (422) y no inicia visita ni geocerca.' }
        mocked: { type: boolean, description: 'true implica 422 LOCATION_MOCKED; ausente implica 422 LOCATION_INTEGRITY_UNKNOWN.' }
        outOfRouteReason: { type: string, maxLength: 500 }
        geofenceExceptionId: { type: string, format: uuid }
    VisitCheckOutRequest:
      type: object
      additionalProperties: false
      required: [clientEventId, endedAt, location, result]
      properties:
        clientEventId: { type: string, format: uuid }
        endedAt: { type: string, format: date-time }
        location: { $ref: '#/components/schemas/GeoPoint' }
        result: { $ref: '#/components/schemas/VisitResultCode' }
        resultReason: { type: string, maxLength: 500 }
    CorrectVisitRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        result: { $ref: '#/components/schemas/VisitResultCode' }
        resultReason: { type: string, maxLength: 500 }
        reason: { type: string, minLength: 5, maxLength: 500 }
    GeofenceExceptionRequest:
      type: object
      additionalProperties: false
      required: [sellerId, customerId, validFrom, validUntil, reason]
      properties:
        sellerId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        routePointId: { type: string, format: uuid }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        reason: { type: string, minLength: 5, maxLength: 500 }
    GeofenceException:
      type: object
      additionalProperties: false
      required: [id, sellerId, customerId, validFrom, validUntil, reason, authorizedBy]
      properties:
        id: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        routePointId: { type: string, format: uuid }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        reason: { type: string, maxLength: 500 }
        authorizedBy: { type: string, format: uuid }

    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, unitPrice, currency, status, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        unitPrice: { type: number, multipleOf: 0.01, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { $ref: '#/components/schemas/EntityStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    ProductPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [sku, name, unitPrice, currency]
      properties:
        sku: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 2, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        unitPrice: { type: number, multipleOf: 0.01, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        sku: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 2, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        unitPrice: { type: number, multipleOf: 0.01, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { $ref: '#/components/schemas/EntityStatus' }

    SaleStatus:
      type: string
      enum: [CONFIRMED, CANCELLED]
    SaleLineRequest:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0, multipleOf: 0.001 }
        observedUnitPrice:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: Referencia del cliente; el precio aplicable lo determina el servidor.
    SaleLine:
      type: object
      additionalProperties: false
      required: [productId, sku, productName, quantity, unitPrice, lineTotal]
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string, maxLength: 80 }
        productName: { type: string, maxLength: 200 }
        quantity: { type: number, exclusiveMinimum: 0, multipleOf: 0.001 }
        unitPrice: { type: number, minimum: 0, multipleOf: 0.01 }
        lineTotal: { type: number, minimum: 0, multipleOf: 0.01 }
    CreateSaleRequest:
      type: object
      additionalProperties: false
      required: [clientEventId, visitId, customerId, occurredAt, lines]
      properties:
        clientEventId: { type: string, format: uuid }
        visitId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        notes: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/SaleLineRequest' }
    UpdateSaleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        clientEventId: { type: string, format: uuid }
        notes: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/SaleLineRequest' }
    CancelSaleRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
    Sale:
      type: object
      additionalProperties: false
      required: [id, visitId, customerId, sellerId, occurredAt, currency, lines, subtotal, total, status, version]
      properties:
        id: { type: string, format: uuid }
        visitId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/SaleLine' }
        subtotal: { type: number, minimum: 0, multipleOf: 0.01 }
        total: { type: number, minimum: 0, multipleOf: 0.01 }
        notes: { type: string, maxLength: 500 }
        status: { $ref: '#/components/schemas/SaleStatus' }
        cancelledAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        cancellationReason: { type: string, maxLength: 500 }
        editableUntil: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    SalePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Sale' }
        page: { $ref: '#/components/schemas/PageInfo' }
    DailySalesSummary:
      type: object
      additionalProperties: false
      required: [date, currency, saleCount, netTotal, visitCount, completedVisitCount]
      properties:
        date: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        saleCount: { type: integer, minimum: 0 }
        netTotal: { type: number, minimum: 0, multipleOf: 0.01 }
        visitCount: { type: integer, minimum: 0 }
        completedVisitCount: { type: integer, minimum: 0 }

    DailyDashboard:
      type: object
      additionalProperties: false
      required: [date, activeSellers, plannedVisits, completedVisits, salesCount, netSales, currency, generatedAt]
      properties:
        date: { type: string, format: date }
        activeSellers: { type: integer, minimum: 0 }
        plannedVisits: { type: integer, minimum: 0 }
        completedVisits: { type: integer, minimum: 0 }
        salesCount: { type: integer, minimum: 0 }
        netSales: { type: number, minimum: 0, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        generatedAt: { type: string, format: date-time }
    SellerReport:
      type: object
      additionalProperties: false
      required: [seller, dateFrom, dateTo, plannedVisits, completedVisits, salesCount, netSales, currency]
      properties:
        seller: { $ref: '#/components/schemas/Seller' }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        plannedVisits: { type: integer, minimum: 0 }
        completedVisits: { type: integer, minimum: 0 }
        salesCount: { type: integer, minimum: 0 }
        netSales: { type: number, minimum: 0, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    CustomerReport:
      type: object
      additionalProperties: false
      required: [customer, dateFrom, dateTo, visitCount, saleCount, netSales, currency]
      properties:
        customer: { $ref: '#/components/schemas/Customer' }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        visitCount: { type: integer, minimum: 0 }
        saleCount: { type: integer, minimum: 0 }
        netSales: { type: number, minimum: 0, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    CoverageReport:
      type: object
      additionalProperties: false
      required: [dateFrom, dateTo, assignedCustomers, visitedCustomers, coveragePercent]
      properties:
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        assignedCustomers: { type: integer, minimum: 0 }
        visitedCustomers: { type: integer, minimum: 0 }
        coveragePercent: { type: number, minimum: 0, maximum: 100 }
    ExportType:
      type: string
      enum: [SALES, VISITS, SELLERS, CUSTOMERS, COVERAGE, AUDIT]
    ExportFormat:
      type: string
      enum: [CSV, XLSX]
    ExportJobStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, FAILED, EXPIRED]
    ReportExportRequest:
      type: object
      additionalProperties: false
      required: [type, format, dateFrom, dateTo]
      properties:
        type: { $ref: '#/components/schemas/ExportType' }
        format: { $ref: '#/components/schemas/ExportFormat' }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        sellerId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        territoryId: { type: string, format: uuid }
    ReportExportJob:
      type: object
      additionalProperties: false
      required: [id, status, type, format, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ExportJobStatus' }
        type: { $ref: '#/components/schemas/ExportType' }
        format: { $ref: '#/components/schemas/ExportFormat' }
        createdAt: { type: string, format: date-time }
        completedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        expiresAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        failureCode: { type: string, maxLength: 80 }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, occurredAt, actorId, action, resourceType, resourceId, correlationId]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorId: { type: string, format: uuid }
        actorDisplayName: { type: string, maxLength: 160 }
        action: { type: string, maxLength: 100 }
        resourceType: { type: string, maxLength: 100 }
        resourceId: { type: string, format: uuid }
        reason: { type: string, maxLength: 500 }
        correlationId: { type: string, maxLength: 100 }
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
    AuditEntryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        page: { $ref: '#/components/schemas/PageInfo' }

    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [installationId, platform, pushToken, appVersion]
      properties:
        installationId: { type: string, format: uuid }
        platform: { type: string, enum: [ANDROID, IOS] }
        pushToken: { type: string, minLength: 10, maxLength: 4096, writeOnly: true }
        appVersion: { type: string, maxLength: 40 }
        deviceModel: { type: string, maxLength: 120 }
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [id, installationId, platform, registeredAt]
      properties:
        id: { type: string, format: uuid }
        installationId: { type: string, format: uuid }
        platform: { type: string, enum: [ANDROID, IOS] }
        registeredAt: { type: string, format: date-time }
    SyncState:
      type: object
      additionalProperties: false
      required: [cursor, serverTime]
      properties:
        cursor: { type: string, maxLength: 500 }
        serverTime: { type: string, format: date-time }
    MobileBootstrap:
      type: object
      additionalProperties: false
      required: [sync, settings, territories, customers, products, routes]
      properties:
        sync: { $ref: '#/components/schemas/SyncState' }
        settings: { $ref: '#/components/schemas/CompanySettings' }
        territories:
          type: array
          items: { $ref: '#/components/schemas/Territory' }
        customers:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        routes:
          type: array
          items: { $ref: '#/components/schemas/Route' }
        deleted:
          type: object
          additionalProperties: false
          properties:
            territoryIds:
              type: array
              items: { type: string, format: uuid }
            customerIds:
              type: array
              items: { type: string, format: uuid }
            productIds:
              type: array
              items: { type: string, format: uuid }
            routeIds:
              type: array
              items: { type: string, format: uuid }
    SyncCommandType:
      type: string
      enum:
        - START_JOURNEY
        - CHECK_IN_VISIT
        - CHECK_OUT_VISIT
        - CREATE_SALE
        - UPDATE_SALE
        - CLOSE_JOURNEY
    SyncCommand:
      type: object
      additionalProperties: false
      required: [commandId, type, occurredAt, payload]
      properties:
        commandId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/SyncCommandType' }
        occurredAt: { type: string, format: date-time }
        aggregateId:
          description: ID local o de servidor usado para preservar orden causal.
          type: string
          maxLength: 120
        payload:
          description: Debe cumplir el esquema del endpoint equivalente según `type`.
          oneOf:
            - $ref: '#/components/schemas/StartJourneyRequest'
            - $ref: '#/components/schemas/VisitCheckInRequest'
            - $ref: '#/components/schemas/VisitCheckOutRequest'
            - $ref: '#/components/schemas/CreateSaleRequest'
            - $ref: '#/components/schemas/UpdateSaleRequest'
            - $ref: '#/components/schemas/CloseJourneyRequest'
    SyncBatchRequest:
      type: object
      additionalProperties: false
      required: [deviceId, commands]
      properties:
        deviceId: { type: string, format: uuid }
        commands:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/SyncCommand' }
    SyncCommandResult:
      type: object
      additionalProperties: false
      required: [commandId, status]
      properties:
        commandId: { type: string, format: uuid }
        status: { type: string, enum: [APPLIED, DUPLICATE, REJECTED, RETRY_LATER] }
        serverResourceId: { type: string, format: uuid }
        serverVersion: { type: integer, minimum: 1 }
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: 'null'
    SyncBatchResponse:
      type: object
      additionalProperties: false
      required: [results, sync]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SyncCommandResult' }
        sync: { $ref: '#/components/schemas/SyncState' }
