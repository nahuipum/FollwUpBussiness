spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: followupbussiness
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fieldsales}
    username: ${POSTGRES_USER:fieldsales_local}
    password: ${POSTGRES_PASSWORD}
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:fieldsales}
    username: ${RABBITMQ_USER:fieldsales_local}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
  rabbitmq.template:
    mandatory: true

management:
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: prometheus

fieldsales:
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:60}
    exchange: ${OUTBOX_EXCHANGE:fieldsales.events}
