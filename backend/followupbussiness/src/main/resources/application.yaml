spring:
  application:
    name: followupbussiness
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fieldsales}
    username: ${POSTGRES_USER:fieldsales_local}
    password: ${POSTGRES_PASSWORD}
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true
